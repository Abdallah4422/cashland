<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 340" width="544" height="340">
  <!-- Background card -->
  <rect width="544" height="340" rx="24" fill="#1a2744"/>

  <!-- Floating circles top-left arc -->
  <circle cx="182" cy="72" r="22" fill="#9ca3af" opacity="0.7"/>
  <circle cx="148" cy="48" r="15" fill="#9ca3af" opacity="0.5"/>
  <circle cx="120" cy="30" r="10" fill="#9ca3af" opacity="0.35"/>

  <!-- Floating circles top-right arc -->
  <circle cx="362" cy="72" r="22" fill="#9ca3af" opacity="0.7"/>
  <circle cx="396" cy="48" r="15" fill="#9ca3af" opacity="0.5"/>
  <circle cx="424" cy="30" r="10" fill="#9ca3af" opacity="0.35"/>

  <!-- Coin platform / shelf -->
  <rect x="148" y="188" width="248" height="10" rx="5" fill="#9ca3af" opacity="0.5"/>
  <!-- Shelf legs -->
  <rect x="164" y="192" width="8" height="18" rx="2" fill="#9ca3af" opacity="0.4"/>
  <rect x="372" y="192" width="8" height="18" rx="2" fill="#9ca3af" opacity="0.4"/>

  <!-- Left coin (Naira) -->
  <circle cx="216" cy="150" r="52" fill="#e5e7eb"/>
  <circle cx="216" cy="150" r="46" fill="#f1f5f9"/>
  <circle cx="216" cy="150" r="40" fill="#e2e8f0"/>
  <!-- Naira symbol -->
  <text x="216" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1a2744">₦</text>

  <!-- Right coin (Dollar) -->
  <circle cx="328" cy="150" r="52" fill="#e5e7eb"/>
  <circle cx="328" cy="150" r="46" fill="#f1f5f9"/>
  <circle cx="328" cy="150" r="40" fill="#e2e8f0"/>
  <!-- Dollar symbol -->
  <text x="328" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1a2744">$</text>

  <!-- Wordmark -->
  <text x="272" y="252" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="white">Cashland</text>

  <!-- Tagline -->
  <text x="272" y="284" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="400" letter-spacing="0.5" fill="#94a3b8">Cash that lands fast</text>
</svg>
