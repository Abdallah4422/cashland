<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#1a2744"/>

  <!-- Floating circles top-left -->
  <circle cx="62" cy="38" r="10" fill="#9ca3af" opacity="0.6"/>
  <circle cx="46" cy="24" r="7" fill="#9ca3af" opacity="0.4"/>

  <!-- Floating circles top-right -->
  <circle cx="138" cy="38" r="10" fill="#9ca3af" opacity="0.6"/>
  <circle cx="154" cy="24" r="7" fill="#9ca3af" opacity="0.4"/>

  <!-- Shelf -->
  <rect x="44" y="126" width="112" height="6" rx="3" fill="#9ca3af" opacity="0.5"/>

  <!-- Left coin (Naira) -->
  <circle cx="80" cy="98" r="32" fill="#e2e8f0"/>
  <circle cx="80" cy="98" r="26" fill="#f1f5f9"/>
  <text x="80" y="107" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1a2744">₦</text>

  <!-- Right coin (Dollar) -->
  <circle cx="120" cy="98" r="32" fill="#e2e8f0"/>
  <circle cx="120" cy="98" r="26" fill="#f1f5f9"/>
  <text x="120" y="107" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1a2744">$</text>

  <!-- Wordmark -->
  <text x="100" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">Cashland</text>

  <!-- Tagline -->
  <text x="100" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" letter-spacing="0.3">Cash that lands fast</text>
</svg>
